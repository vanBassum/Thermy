dependencies:
  idf:
    version: ">=5.0.0"
  espressif/mdns: ^1

  # ── Display: the WT32-SC01 panel (ST7796 LCD + FT6336 touch) ──
  lvgl/lvgl: ^8
  espressif/esp_lcd_st7796: ^1.0.3
  espressif/esp_lcd_touch: ^1
  espressif/esp_lcd_touch_ft5x06: ^1

  # ── DS18B20 temperature probes on 1-Wire ──
  espressif/onewire_bus: ^1.0.4
  espressif/ds18b20: ^0.2.0

# esp_websocket_client is deliberately absent: the relay drives a WebSocket through
# the built-in tcp_transport layer instead, so the reading happens on the task that
# runs the command. See Application/RelayManager/RelaySocket.h.
